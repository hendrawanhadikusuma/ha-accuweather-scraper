<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Network Card Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050b14;
      --panel: rgba(255, 255, 255, 0.03);
      --text: rgba(255, 255, 255, 0.96);
      --muted: rgba(255, 255, 255, 0.68);
      --muted-soft: rgba(255, 255, 255, 0.54);
      --cyan: #58d8ff;
      --green: #34d399;
      --amber: #fbbf24;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 18%, rgba(34, 211, 238, 0.10), transparent 26%),
        radial-gradient(circle at 82% 10%, rgba(52, 211, 153, 0.08), transparent 24%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    .card {
      max-width: 980px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(6, 14, 28, 0.98), rgba(3, 9, 18, 0.98));
      border: 1px solid rgba(125, 211, 252, 0.14);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .wrapper {
      padding: 12px;
      background:
        radial-gradient(circle at 18% 18%, rgba(34, 211, 238, 0.10), transparent 26%),
        radial-gradient(circle at 82% 10%, rgba(52, 211, 153, 0.08), transparent 24%),
        linear-gradient(180deg, rgba(7, 15, 28, 0.94), rgba(3, 8, 16, 0.98));
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--cyan);
    }

    .title span { color: rgba(255, 255, 255, 0.8); }

    .subtitle {
      margin-top: 2px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .badge {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.12), rgba(34, 211, 238, 0.03));
      border: 1px solid rgba(34, 211, 238, 0.12);
      color: var(--cyan);
    }

    .icon svg {
      width: 34px;
      height: 34px;
      display: block;
    }

    .copy { display: grid; gap: 2px; min-width: 0; }
    .name {
      font-size: 0.92rem;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .line {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      display: grid;
      justify-items: end;
      gap: 6px;
      min-width: 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(52, 211, 153, 0.34);
      color: var(--green);
      background: rgba(52, 211, 153, 0.08);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .connected {
      display: grid;
      gap: 2px;
      text-align: right;
    }

    .connected-key {
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted-soft);
    }

    .connected-value {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1;
      color: #7dd3fc;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .metric {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr) 116px;
      gap: 8px;
      align-items: center;
      min-height: 56px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .metric.wide { grid-column: 1 / -1; }

    .metric.no-chart {
      grid-template-columns: 88px minmax(0, 1fr);
    }

    .metric.no-chart .metric-value {
      justify-self: end;
    }

    .metric-label {
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .metric-value {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .metric-value span {
      font-size: 0.72rem;
      font-weight: 700;
      opacity: 0.75;
    }

    .chart {
      width: 100%;
      height: 30px;
      display: block;
    }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .wrapper { padding: 10px; }
      .header { flex-direction: column; }
      .summary { align-items: flex-start; }
      .meta { justify-items: start; }
      .connected { text-align: left; }
      .metrics { grid-template-columns: 1fr; }
      .metric,
      .metric.wide {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "label value"
          "chart chart";
        gap: 4px 8px;
      }
      .metric.no-chart {
        grid-template-areas: "label value";
      }
      .metric-label { grid-area: label; }
      .metric-value { grid-area: value; }
      .chart { grid-area: chart; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="wrapper">
      <div class="header">
        <div>
          <div class="title">Network <span>/ Router</span></div>
          <div class="subtitle">TL-WR820N 300Mbps Wi-Fi Router</div>
        </div>
      </div>

      <div class="summary">
        <div class="badge">
          <div class="icon">
            <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
              <rect x="10" y="28" width="44" height="16" rx="8" fill="#7dd3fc" opacity="0.95" />
              <rect x="16" y="19" width="32" height="8" rx="4" fill="#0b1220" opacity="0.9" />
              <rect x="18" y="45" width="4" height="8" rx="2" fill="#7dd3fc" />
              <rect x="42" y="45" width="4" height="8" rx="2" fill="#7dd3fc" />
              <path d="M22 22c2.5-2.6 5.5-3.9 9-3.9s6.5 1.3 9 3.9" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" />
              <path d="M18 17c3.6-4 8.1-6 13-6s9.4 2 13 6" fill="none" stroke="#7dd3fc" stroke-opacity="0.7" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </div>
          <div class="copy">
            <div class="name">TL-WR820N 300Mbps Wi-Fi Router</div>
            <div class="line">WAN 115.166.115.162</div>
            <div class="line">Updated 28 Aug 2026, 18:42</div>
          </div>
        </div>
        <div class="meta">
          <div class="pill">Online</div>
          <div class="connected">
            <div class="connected-key">Connected Devices</div>
            <div class="connected-value">12</div>
          </div>
        </div>
      </div>

      <div class="metrics">
        <div class="metric no-chart">
          <div class="metric-label">Download</div>
          <div class="metric-value">85 <span>Mbps</span></div>
        </div>

        <div class="metric no-chart">
          <div class="metric-label">Upload</div>
          <div class="metric-value">21 <span>Mbps</span></div>
        </div>

        <div class="metric wide">
          <div class="metric-label">Latency</div>
          <div class="metric-value">8 <span>ms</span></div>
          <svg class="chart" viewBox="0 0 160 36" aria-hidden="true">
            <path d="M 0 24 L 16 26 L 32 22 L 48 20 L 64 24 L 80 18 L 96 22 L 112 19 L 128 20 L 144 16 L 160 18 L 160 32 L 0 32 Z" fill="rgba(251,191,36,0.16)" />
            <path d="M 0 24 L 16 26 L 32 22 L 48 20 L 64 24 L 80 18 L 96 22 L 112 19 L 128 20 L 144 16 L 160 18" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
