<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Match Card Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050b14;
      --text: rgba(255, 255, 255, 0.96);
      --muted: rgba(255, 255, 255, 0.68);
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 16%, rgba(59, 130, 246, 0.16), transparent 28%),
        radial-gradient(circle at 84% 8%, rgba(168, 85, 247, 0.12), transparent 24%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    .card {
      max-width: 980px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(7, 12, 22, 0.98), rgba(3, 8, 16, 0.98));
      border: 1px solid rgba(96, 165, 250, 0.16);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .wrapper {
      padding: 8px;
      background:
        radial-gradient(circle at 20% 18%, rgba(59, 130, 246, 0.12), transparent 24%),
        radial-gradient(circle at 86% 10%, rgba(168, 85, 247, 0.08), transparent 22%),
        linear-gradient(180deg, rgba(7, 15, 28, 0.88), rgba(3, 8, 16, 0.96));
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .title {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #8ab4ff;
    }

    .title span { color: rgba(255, 255, 255, 0.78); }

    .subtitle {
      margin-top: 1px;
      font-size: 0.74rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(96, 165, 250, 0.34);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.08);
    }

    .summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      padding: 8px 10px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .team {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .team.away {
      justify-self: end;
      text-align: right;
      grid-template-columns: minmax(0, 1fr) 40px;
    }

    .team.away .copy { order: 1; }
    .team.away .logo { order: 2; }

    .logo {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      overflow: hidden;
      background: radial-gradient(circle, rgba(96, 165, 250, 0.12), rgba(96, 165, 250, 0.03));
      border: 1px solid rgba(96, 165, 250, 0.14);
    }

    .logo.away {
      background: radial-gradient(circle, rgba(168, 85, 247, 0.12), rgba(168, 85, 247, 0.03));
      border-color: rgba(168, 85, 247, 0.14);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: scale-down;
      object-position: center;
      padding: 4px;
      display: block;
    }

    .copy {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .name {
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      font-size: 0.65rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .middle {
      display: grid;
      gap: 2px;
      justify-items: center;
      min-width: 56px;
    }

    .vs {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.84);
    }

    .score {
      font-size: 1.42rem;
      font-weight: 900;
      line-height: 1;
      color: #e0f2fe;
    }

    .score-label {
      font-size: 0.57rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.52);
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 6px;
    }

    .item {
      padding: 6px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      min-width: 0;
    }

    .label {
      font-size: 0.56rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.56);
      margin-bottom: 2px;
    }

    .value {
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.92);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .wrapper { padding: 8px; }
      .header { flex-direction: column; }
      .summary { grid-template-columns: 1fr; gap: 8px; }
      .team, .team.away { justify-self: stretch; text-align: left; grid-template-columns: 40px minmax(0, 1fr); }
      .team.away .copy, .team.away .logo { order: initial; }
      .middle { justify-items: start; }
      .info { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="wrapper">
      <div class="header">
        <div>
          <div class="title">MATCH <span>/ Match</span></div>
          <div class="subtitle">Mobile Legends</div>
        </div>
        <div class="status">UPCOMING</div>
      </div>

      <div class="summary">
        <div class="team">
          <div class="logo">
            <img src="https://liquipedia.net/commons/images/thumb/1/1e/Rex_Regum_Qeon_allmode.png/70px-Rex_Regum_Qeon_allmode.png" alt="RRQ Hoshi logo" />
          </div>
          <div class="copy">
            <div class="name">RRQ Hoshi</div>
            <div class="meta">Main team</div>
          </div>
        </div>

        <div class="middle">
          <div class="vs">VS</div>
          <div class="score">-- <span style="opacity:.6">:</span> --</div>
          <div class="score-label">Score</div>
        </div>

        <div class="team away">
          <div class="copy">
            <div class="name">Geek Fam ID</div>
            <div class="meta">Opponent</div>
          </div>
          <div class="logo away">
            <img src="https://liquipedia.net/commons/images/thumb/4/41/Geek_Fam_2019_allmode.png/87px-Geek_Fam_2019_allmode.png" alt="Geek Fam ID logo" />
          </div>
        </div>
      </div>

      <div class="info">
        <div class="item">
          <div class="label">Date</div>
          <div class="value">Sun, 30 Aug, 5:00 PM</div>
        </div>
        <div class="item">
          <div class="label">Venue</div>
          <div class="value">MPL Indonesia Season 18 - RS: Week 3</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
